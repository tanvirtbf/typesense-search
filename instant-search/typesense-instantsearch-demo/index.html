<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />

    <link rel="shortcut icon" href="./favicon.png" />

    <!-- InstantSearch default styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/instantsearch.css@8/themes/satellite-min.css"
    />

    <!-- Project styles -->
    <link rel="stylesheet" href="./src/index.css" />
    <link rel="stylesheet" href="./src/app.css" />

    <title>Typesense InstantSearch Demo</title>
  </head>

  <body>
    <header class="header">
      <h1 class="header-title">
        <a href="/">Typesense InstantSearch Demo</a>
      </h1>

      <p class="header-subtitle">
        Search UI using InstantSearch.js + Typesense
      </p>
    </header>

    <main class="container">
      <div class="search-panel">
        <div class="search-panel__results">
          <div id="searchbox"></div>

          <div id="stats"></div>

          <div id="hits"></div>

          <div id="pagination"></div>
        </div>
      </div>
    </main>

    <!-- InstantSearch.js -->
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.97.0"></script>

    <!-- App JS -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
